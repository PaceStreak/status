# NOTE (2026-08-28): `update-template` cannot regenerate this file. GITHUB_TOKEN
# is categorically forbidden from writing under .github/workflows, whatever the
# org's workflow permissions say. Regenerating these from CI requires a personal
# access token with the `workflow` scope stored as the GH_PAT secret. Until then
# these files are maintained by hand, and edits here will NOT be overwritten.

name: Updates CI
on:
  schedule:
    - cron: "0 3 * * *"
  repository_dispatch:
    types: [updates]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Deploy updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update code
        uses: upptime/updates@master
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
